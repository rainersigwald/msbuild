  - job: Asset_Registry_Publish
    dependsOn:
    - Windows_NT
    timeoutInMinutes: 150
    displayName: Publish to Build Asset Registry
    pool:
      name: AzurePipelines-EO
      os: windows
      demands:
      - ImageOverride -equals 1ESPT-Windows2022
      - Cmd
    variables:
    - name: OneESPT
      value: true
      readonly: true
    - name: OneESPT.BuildType
      value: Official
      readonly: true
    - name: OneESPT.OS
      value: windows
      readonly: true
    - name: Codeql.SkipTaskAutoInjection
      value: true
    - name: skipComponentGovernanceDetection
      value: true
    - name: DncEngInternalBuildPool
      value: $[ replace( replace( eq(contains(coalesce(variables['System.PullRequest.TargetBranch'], variables['Build.SourceBranch'], 'refs/heads/main'), 'release'), 'true'), True, 'NetCore1ESPool-Svc-Internal' ), False, 'NetCore1ESPool-Internal' ) ]
    - group: Publish-Build-Assets
    - group: AzureDevOps-Artifact-Feeds-Pats
    - name: runCodesignValidationInjection
      value: false
    - group: Publish-Build-Assets
    - name: IsInternalBuild
      value: False
    - name: MaestroApiEndPoint
      value: https://maestro.dot.net
    - name: MaestroApiVersion
      value: 2020-02-20
    - name: SourceLinkCLIVersion
      value: 3.0.0
    - name: SymbolToolVersion
      value: 1.0.1
    - name: BinlogToolVersion
      value: 1.0.11
    - name: runCodesignValidationInjection
      value: false
    - name: OfficialBuildId
      value: $(Build.BuildNumber)
    - name: OneES_targetName
      value: host
    steps:
    - task: 1ESGPTRunTask@3.0.513
      displayName: Validate Hosted Pool Information (1ES PT)
      continueOnError: false
      target:
        container: host
      env:
        HOST_ARCHITECTURE: amd64
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        OneES_PipelineWorkspace: $(Pipeline.Workspace)
        PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
        PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: validateHostedPool.ps1
        useScriptViaFeed: false
        arguments: '-TargetName $(OneES_targetName) -StepTargets [] -StepsLength 10 -SkipStatelessValidation False -OS windows -IsOfficialTemplate  '
    - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
      displayName: "\U0001F512 Start Network Isolation"
      continueOnError: true
      timeoutInMinutes: 2
      inputs:
        networkIsolationMode: Enforce
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: False
        fetchDepth: 3
        clean: true
      target:
        container: host
    - task: CodeQL3000Init@0
      displayName: "\U0001F6E1 CodeQL Initialize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      target:
        container: host
      continueOnError: true
      inputs:
        Enabled: true
        BuildIdentifier: build_Asset_Registry_Publish
        LanguageDetectorFilter: compiled
    - task: 1ESGPTRunTask@3.0.513
      displayName: "\U0001F6E1 Guardian: Analysis Setup (1ES PT)"
      continueOnError: true
      target:
        container: host
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: sdl_guardian_analysis_setup.py
        useScriptViaFeed: false
        arguments: --autoEnableRoslynWithNewRuleset=True --autoEnablePREfastWithNewRuleset=True
    - task: DownloadPipelineArtifact@2
      condition: ''
      continueOnError: false
      inputs:
        artifactName: AssetManifests
        targetPath: $(Build.StagingDirectory)/AssetManifests
      target:
        container: host
      displayName: Download Asset Manifests
    - task: NuGetAuthenticate@1
      target:
        container: host
      displayName: NuGetAuthenticate@1
    - task: AzureCLI@2
      condition: ''
      continueOnError: false
      inputs:
        azureSubscription: 'Darc: Maestro Production'
        scriptType: ps
        scriptLocation: scriptPath
        scriptPath: $(System.DefaultWorkingDirectory)/eng/common/sdk-task.ps1
        arguments: -task PublishBuildAssets -restore -msbuildEngine dotnet /p:ManifestsPath='$(Build.StagingDirectory)/AssetManifests' /p:IsAssetlessBuild=false /p:MaestroApiEndpoint=https://maestro.dot.net /p:OfficialBuildId=$(OfficialBuildId)
      target:
        container: host
      displayName: Publish Build Assets
    - task: powershell@2
      inputs:
        targetType: inline
        script: >
          New-Item -Path "$(Build.StagingDirectory)/ReleaseConfigs" -ItemType Directory -Force

          $filePath = "$(Build.StagingDirectory)/ReleaseConfigs/ReleaseConfigs.txt"

          Add-Content -Path $filePath -Value $(BARBuildId)

          Add-Content -Path $filePath -Value "$(DefaultChannels)"

          Add-Content -Path $filePath -Value $(IsStableBuild)


          $symbolExclusionfile = "$(System.DefaultWorkingDirectory)/eng/SymbolPublishingExclusionsFile.txt"

          if (Test-Path -Path $symbolExclusionfile)

          {
            Write-Host "SymbolExclusionFile exists"
            Copy-Item -Path $symbolExclusionfile -Destination "$(Build.StagingDirectory)/ReleaseConfigs"
          }
      target:
        container: host
      displayName: Create ReleaseConfigs Artifact
    - task: 1ESGPTRunTask@3.0.513
      displayName: SDL Binary Analysis Checks via inline task (1ES PT)
      continueOnError: false
      target:
        container: host
      condition: succeeded()
      env:
        SCAN_DIRECTORY: $(Build.StagingDirectory)/ReleaseConfigs
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: sdlBinaryAnalysisChecks.ps1
        useScriptViaFeed: false
        arguments: '-PublishLogsArtifactName drop_build_Asset_Registry_Publish_sdl_analysis -MustRunBinaryScan '
    - task: 1ESGPTRunTask@3.0.513
      displayName: Auto-baselining mode and SDL pre-checks (1ES PT)
      continueOnError: true
      target:
        container: host
      condition: succeeded()
      env:
        categories: retail.binary
        condition: and( succeeded(), succeeded() )
        isMultirepoScenario: False
        enableMultirepoScenario: True
        autoBaselineFeatureFlag: True
        credscanEnabled: False
        policheckEnabled: True
        eslintEnabled: True
        banditEnabled: False
        csrfEnabled: False
        psscriptanalyzerEnabled: True
        armoryEnabled: True
        binskimEnabled: True
        prefastEnabled: False
        spotbugsEnabled: True
        roslynEnabled: False
