- stage: publish_using_darc
  displayName: Publish using Darc
  dependsOn:
  - build
  variables:
  - group: Publish-Build-Assets
  - name: IsInternalBuild
    value: False
  - name: MaestroApiEndPoint
    value: https://maestro.dot.net
  - name: MaestroApiVersion
    value: 2020-02-20
  - name: SourceLinkCLIVersion
    value: 3.0.0
  - name: SymbolToolVersion
    value: 1.0.1
  - name: BinlogToolVersion
    value: 1.0.11
  - name: runCodesignValidationInjection
    value: false
  - name: DncEngInternalBuildPool
    value: $[ replace( replace( eq(contains(coalesce(variables['System.PullRequest.TargetBranch'], variables['Build.SourceBranch'], 'refs/heads/main'), 'release'), 'true'), True, 'NetCore1ESPool-Svc-Internal' ), False, 'NetCore1ESPool-Internal' ) ]
  pool:
    name: VSEngSS-MicroBuild2022-1ES
    os: windows
  jobs:
  - job: ''
    displayName: Publish Using Darc
    timeoutInMinutes: 120
    pool:
      name: AzurePipelines-EO
      os: windows
      demands:
      - ImageOverride -equals 1ESPT-Windows2022
      - Cmd
    variables:
    - name: OneESPT
      value: true
      readonly: true
    - name: OneESPT.BuildType
      value: Official
      readonly: true
    - name: OneESPT.OS
      value: windows
      readonly: true
    - name: Codeql.SkipTaskAutoInjection
      value: true
    - name: skipComponentGovernanceDetection
      value: true
    - name: OneES_targetName
      value: host
    steps:
    - task: 1ESGPTRunTask@3.0.513
      displayName: Validate Hosted Pool Information (1ES PT)
      continueOnError: false
      target:
        container: host
      env:
        HOST_ARCHITECTURE: amd64
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        OneES_PipelineWorkspace: $(Pipeline.Workspace)
        PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
        PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: validateHostedPool.ps1
        useScriptViaFeed: false
        arguments: '-TargetName $(OneES_targetName) -StepTargets [] -StepsLength 4 -SkipStatelessValidation False -OS windows -IsOfficialTemplate  '
    - task: CodeQL3000Init@0
      displayName: "\U0001F6E1 CodeQL Initialize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      target:
        container: host
      continueOnError: true
      inputs:
        Enabled: true
        BuildIdentifier: publish_using_darc_
        LanguageDetectorFilter: compiled
    - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
      displayName: "\U0001F512 Start Network Isolation"
      continueOnError: true
      timeoutInMinutes: 2
      inputs:
        networkIsolationMode: Enforce
    - task: 1ESGPTRunTask@3.0.513
      displayName: "\U0001F6E1 Guardian: Analysis Setup (1ES PT)"
      continueOnError: true
      target:
        container: host
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: sdl_guardian_analysis_setup.py
        useScriptViaFeed: false
        arguments: --autoEnableRoslynWithNewRuleset=True --autoEnablePREfastWithNewRuleset=True
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: current
        artifactName: ReleaseConfigs
        checkDownloadedFiles: true
      target:
        container: host
      displayName: Download Release Configs
    - task: AzureCLI@2
      name: setReleaseVars
      env:
        PromoteToMaestroChannels: ''
      inputs:
        azureSubscription: 'Darc: Maestro Production'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: >
          try {
            if (!$Env:PromoteToMaestroChannels -or $Env:PromoteToMaestroChannels.Trim() -eq '') {
              $Content = Get-Content $(Build.StagingDirectory)/ReleaseConfigs/ReleaseConfigs.txt

              $BarId = $Content | Select -Index 0
              $Channels = $Content | Select -Index 1
              $IsStableBuild = $Content | Select -Index 2

              $AzureDevOpsProject = $Env:System_TeamProject
              $AzureDevOpsBuildDefinitionId = $Env:System_DefinitionId
              $AzureDevOpsBuildId = $Env:Build_BuildId
            }
            else {
              . $(System.DefaultWorkingDirectory)\eng\common\tools.ps1
              $darc = Get-Darc
              $buildInfo = & $darc get-build `
                --id 0 `
                --extended `
                --output-format json `
                --ci `
                | convertFrom-Json

              $BarId = 0
              $Channels = $Env:PromoteToMaestroChannels -split ","
              $Channels = $Channels -join "]["
              $Channels = "[$Channels]"

              $IsStableBuild = $buildInfo.stable
              $AzureDevOpsProject = $buildInfo.azureDevOpsProject
              $AzureDevOpsBuildDefinitionId = $buildInfo.azureDevOpsBuildDefinitionId
              $AzureDevOpsBuildId = $buildInfo.azureDevOpsBuildId
            }

            Write-Host "##vso[task.setvariable variable=BARBuildId]$BarId"
            Write-Host "##vso[task.setvariable variable=TargetChannels]$Channels"
            Write-Host "##vso[task.setvariable variable=IsStableBuild]$IsStableBuild"

            Write-Host "##vso[task.setvariable variable=AzDOProjectName]$AzureDevOpsProject"
            Write-Host "##vso[task.setvariable variable=AzDOPipelineId]$AzureDevOpsBuildDefinitionId"
            Write-Host "##vso[task.setvariable variable=AzDOBuildId]$AzureDevOpsBuildId"
          }

          catch {
            Write-Host $_
            Write-Host $_.Exception
            Write-Host $_.ScriptStackTrace
            exit 1
          }
      target:
        container: host
      displayName: Set Release Configs Vars
    - task: NuGetAuthenticate@1
      target:
        container: host
      displayName: NuGetAuthenticate@1
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'Darc: Maestro Production'
        scriptType: ps
        scriptLocation: scriptPath
        scriptPath: $(System.DefaultWorkingDirectory)/eng/common/post-build/publish-using-darc.ps1
        arguments: >
          -BuildId $(BARBuildId) -PublishingInfraVersion 3 -AzdoToken '$(System.AccessToken)' -WaitPublishingFinish true -RequireDefaultChannels False -ArtifactsPublishingAdditionalParameters '' -SymbolPublishingAdditionalParameters '' -SkipAssetsPublishing 'False'
      target:
        container: host
      displayName: Publish Using Darc
    - task: 1ESGPTRunTask@3.0.513
      displayName: "\U0001F512 Stop Golang Module Proxy Credential Provider (If Running) (1ES PT)"
      continueOnError: true
      target:
        container: host
      condition: eq(variables['TERRAPIN_GOLANG_CRED_PROVIDER_STARTED'], 'true')
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: golangModuleProxyStartStop.ps1
        useScriptViaFeed: false
        arguments: >
          -action stopIfRunning
    - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
      displayName: "\U0001F512 Stop Network Isolation"
      condition: always()
      continueOnError: true
      timeoutInMinutes: 2
      inputs:
        networkIsolationMode: Stop
    - task: CodeQL3000Finalize@0
      displayName: "\U0001F6E1 CodeQL Finalize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      target:
        container: host
      continueOnError: true
    - task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
      displayName: "\U0001F6E1 Component Governance"
      condition: and(succeeded(), ne(variables['ONEES_ENFORCED_COMPONENTGOVERNANCE_ENABLED'], 'false'))
      target:
        container: host
      inputs:
        scanType: 'Register'
        verbosity: Verbose
        sourceScanPath: '$(Build.SourcesDirectory)'
        ignoreDirectories: ''
        alertWarningLevel: ''
        failOnAlert: ''
