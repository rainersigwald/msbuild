trigger:
  branches:
    include:
    - exp/*
    - perf/*
parameters:
- name: OptProfDropName
  displayName: Optional OptProfDrop Override
  type: string
  default: 'default'
- name: enableSigningValidation
  displayName: Enable Signing Validation
  type: boolean
  default: false
- name: signTypeParameter
  displayName: Sign Type
  type: string
  default: 'test'
- name: enableOptProf
  displayName: Enable OptProf data collection for this build
  type: boolean
  default: false
variables:
- name: OptProfDrop
  value: ''
- name: requireDefaultChannels
  value: false
- name: SourceBranch
  value: $(IbcSourceBranchName)
- name: SourceBranch
  value: main
- name: Codeql.Enabled
  value: false
- group: DotNet-MSBuild-SDLValidation-Params
- group: AzureDevOps-Artifact-Feeds-Pats
- name: cfsNugetWarnLevel
  value: warn
- name: nugetMultiFeedWarnLevel
  value: none
- name: NugetSecurityAnalysisWarningLevel
  value: none
resources:
  containers: []
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
stages:
- stage: build
  displayName: Build
  pool:
    name: VSEngSS-MicroBuild2022-1ES
    os: windows
  jobs:
  - job: Windows_NT
    timeoutInMinutes: 180
    pool:
      name: VSEngSS-MicroBuild2022-1ES
      demands:
      - agent.os -equals Windows_NT
    variables:
    - name: OneESPT
      value: true
      readonly: true
    - name: OneESPT.BuildType
      value: Official
      readonly: true
    - name: OneESPT.OS
      value: windows
      readonly: true
    - name: Codeql.SkipTaskAutoInjection
      value: true
    - name: skipComponentGovernanceDetection
      value: true
    - group: Publish-Build-Assets
    - name: TeamName
      value: MSBuild
    - name: VisualStudio.MajorVersion
      value: 18
    - name: VisualStudio.ChannelName
      value: int.main
    - name: VisualStudio.DropName
      value: Products/$(System.TeamProject)/$(Build.Repository.Name)/$(Build.SourceBranchName)/$(Build.BuildNumber)
    - name: OneES_targetName
      value: host
    steps:
    - task: 1ESGPTRunTask@3.0.513
      displayName: Validate Hosted Pool Information (1ES PT)
      continueOnError: false
      target:
        container: host
      env:
        HOST_ARCHITECTURE: amd64
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        OneES_PipelineWorkspace: $(Pipeline.Workspace)
        PIPELINEGOVERNANCESTATUS_AUDITED: variables['PipelineGovernanceStatus_Audited']
        PIPELINECLASSIFICATION_AUDITED: variables['PipelineClassification_Audited']
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: validateHostedPool.ps1
        useScriptViaFeed: false
        arguments: '-TargetName $(OneES_targetName) -StepTargets [] -StepsLength 26 -SkipStatelessValidation False -OS windows -IsOfficialTemplate  '
    - task: CodeQL3000Init@0
      displayName: "\U0001F6E1 CodeQL Initialize"
      condition: and(ne(variables['ONEES_ENFORCED_CODEQL_ENABLED'], 'false'), or(eq(False, true), eq(variables['OneES_DefaultRepoBranch'], variables['Build.SourceBranch'])))
      target:
        container: host
      continueOnError: true
      inputs:
        Enabled: true
        BuildIdentifier: build_Windows_NT
        LanguageDetectorFilter: compiled
    - task: ms-1es.1es-networkisolation-tasks.661EE24A-9364-4A3B-A725-3CBEB6F35E4B.1ESNetworkIsolation@1
      displayName: "\U0001F512 Start Network Isolation"
      continueOnError: true
      timeoutInMinutes: 2
      inputs:
        networkIsolationMode: Enforce
    - task: 1ESGPTRunTask@3.0.513
      displayName: "\U0001F6E1 Guardian: Analysis Setup (1ES PT)"
      continueOnError: true
      target:
        container: host
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: sdl_guardian_analysis_setup.py
        useScriptViaFeed: false
        arguments: --autoEnableRoslynWithNewRuleset=True --autoEnablePREfastWithNewRuleset=True
    - task: NuGetToolInstaller@1
      target:
        container: host
      displayName: Install NuGet.exe
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: Get-MpComputerStatus
        pwsh: true
      target:
        container: host
      displayName: PowerShell@2
    - task: PowerShell@2
      inputs:
        targetType: inline
        script: Set-MpPreference -DisableRealtimeMonitoring $true
        pwsh: true
      target:
        container: host
      displayName: PowerShell@2
    - task: PowerShell@2
      env:
        Token: $(dn-bot-dnceng-artifact-feeds-rw)
      inputs:
        filePath: $(Build.SourcesDirectory)/eng/common/SetupNugetSources.ps1
        arguments: -ConfigFile $(Build.SourcesDirectory)/NuGet.config -Password $Env:Token
      target:
        container: host
      displayName: Setup Private Feeds Credentials
    - task: NuGetCommand@2
      inputs:
        command: restore
        feedsToUse: config
        restoreSolution: eng\common\internal\Tools.csproj
        nugetConfigPath: eng\common\internal\NuGet.config
        restoreDirectory: $(Build.SourcesDirectory)\.packages
      target:
        container: host
      displayName: Restore internal tools
    - task: MicroBuildSigningPlugin@4
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      condition: and(succeeded(), in('test', 'test', 'real'))
      inputs:
        signType: test
        zipSources: false
        feedSource: https://devdiv.pkgs.visualstudio.com/_packaging/MicroBuildToolset/nuget/v3/index.json
      target:
        container: host
      displayName: Install MicroBuild plugin
    - task: MicroBuildOptProfPlugin@6
      condition: and(succeeded(), False)
      inputs:
        ProfilingInputsDropName: $(VisualStudio.DropName)
        ShouldSkipOptimize: true
        AccessToken: $(System.AccessToken)
        feedSource: https://devdiv.pkgs.visualstudio.com/DefaultCollection/_packaging/MicroBuildToolset/nuget/v3/index.json
      target:
        container: host
      displayName: Install OptProf Plugin
    - task: MicroBuildSwixPlugin@4
      inputs:
        dropName: $(VisualStudio.DropName)
      target:
        container: host
      displayName: MicroBuildSwixPlugin@4
    - task: CmdLine@2
      condition: succeeded()
      inputs:
        script: eng/CIBuild.cmd -configuration $(BuildConfiguration) -officialBuildId $(Build.BuildNumber) -officialSkipApplyOptimizationData $(SkipApplyOptimizationData) /p:RepositoryName=$(Build.Repository.Name) /p:VisualStudioIbcSourceBranchName=$(SourceBranch) /p:VisualStudioDropAccessToken=$(System.AccessToken) /p:VisualStudioDropName=$(VisualStudio.DropName) /p:DotNetSignType=test /p:TeamName=MSBuild /p:DotNetPublishUsingPipelines=true /p:VisualStudioIbcDrop=$(OptProfDrop) /p:GenerateSbom=true /p:SuppressFinalPackageVersion=True /p:IsExperimental=True
      target:
        container: host
      displayName: Build
    - task: PowerShell@2
      condition: or(eq(variables['Agent.Os'], 'Windows_NT'), eq(variables['Agent.Os'], 'Darwin'))
      inputs:
        filePath: ./eng/common/generate-sbom-prep.ps1
        arguments: $(Build.ArtifactStagingDirectory)/sbom
      target:
        container: host
      displayName: Prep for SBOM generation in (Non-linux)
    - task: CmdLine@2
      condition: eq(variables['Agent.Os'], 'Linux')
      continueOnError: true
      inputs:
        script: >
          chmod +x ./eng/common/generate-sbom-prep.sh

          ./eng/common/generate-sbom-prep.sh $(Build.ArtifactStagingDirectory)/sbom
      target:
        container: host
      displayName: Prep for SBOM generation in (Linux)
    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      continueOnError: true
      inputs:
        PackageName: .NET
        BuildDropPath: $(System.DefaultWorkingDirectory)/artifacts
        PackageVersion: 10.0.0
        ManifestDirPath: $(Build.ArtifactStagingDirectory)/sbom/$(ARTIFACT_NAME)
      target:
        container: host
      displayName: Generate SBOM manifest
    - task: 1ESGPTRunTask@3.0.513
      displayName: SDL Binary Analysis Checks via inline task (1ES PT)
      continueOnError: false
      target:
        container: host
      condition: succeeded()
      env:
        SCAN_DIRECTORY: $(Build.ArtifactStagingDirectory)/sbom
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: sdlBinaryAnalysisChecks.ps1
        useScriptViaFeed: false
        arguments: '-PublishLogsArtifactName drop_build_Windows_NT_sdl_analysis -MustRunBinaryScan '
    - task: 1ESGPTRunTask@3.0.513
      displayName: Auto-baselining mode and SDL pre-checks (1ES PT)
      continueOnError: true
      target:
        container: host
      condition: succeeded()
      env:
        categories: retail.binary
        condition: and( succeeded(), succeeded() )
        isMultirepoScenario: False
        enableMultirepoScenario: True
        autoBaselineFeatureFlag: True
        credscanEnabled: False
        policheckEnabled: True
        eslintEnabled: True
        banditEnabled: False
        csrfEnabled: False
        psscriptanalyzerEnabled: True
        armoryEnabled: True
        binskimEnabled: True
        prefastEnabled: False
        spotbugsEnabled: True
        roslynEnabled: False
        accessibilityinsightsEnabled: True
        localRetailBaselineFilePath: $(Build.SourcesDirectory)/.config/guardian/.gdnbaselines
        systemAccessToken: $(System.AccessToken)
        systemCollectionUri: $(System.CollectionUri)
        systemTeamProject: $(System.TeamProject)
        systemDefinitionId: $(System.DefinitionId)
        buildSourceVersion: $(Build.SourceVersion)
        buildSourceBranch: $(Build.SourceBranch)
        buildSourcesDirectory: $(Build.SourcesDirectory)
        buildRepositoryId: $(Build.Repository.ID)
        buildRepositoryName: $(Build.Repository.Name)
        buildRepositoryProvider: $(Build.Repository.Provider)
        buildRepositoryUri: $(Build.Repository.Uri)
        pipelineWorkspace: $(Pipeline.Workspace)
        toolsToUpdateAfterCertainDate: retail.binary.credscan:2024-02-29,retail.binary.binskim:2024-02-29,retail.binary.prefast:2024-02-29,retail.binary.spotbugs:2024-02-29,retail.binary.roslyn:2024-02-29
        toolsToAddOnlyNewResultsAfterCertainDate: retail.binary.binskim:2024-11-13,retail.binary.prefast:2024-11-13
        deleteBaselineEntriesBeforeDate: 2024-02-29 00:00:00Z
        credscanBreak: True
        policheckBreak: True
        eslintBreak: False
        banditBreak: False
        csrfBreak: False
        psscriptanalyzerBreak: False
        armoryBreak: False
        binskimBreak: False
        prefastBreak: False
        spotbugsBreak: False
        roslynBreak: True
        accessibilityinsightsBreak: False
        GDN_CB_TEMPLATE_INTERNAL: $(GDN_CB_TEMPLATE)
        isOfficial: True
        disableAutoBaselineOnNonDefaultBranches: False
        isMainPipeline: False
        skipUsingMainPipelineConfig: False
        agentOS: windows
        useGitOps: True
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: autobaselining_mode_and_sdl_breakglass_checks.py
        useScriptViaFeed: false
    - task: PublishPipelineArtifact@1
      displayName: Publish new tools list (1ES PT)
      condition: and( succeeded(), succeeded(), ne('', variables['OneES_AutoBaseline_MetadataFolder']) )
      continueOnError: true
      inputs:
        artifactName: 1espt-autobaseline-build-Windows_NT
        targetPath: $(OneES_AutoBaseline_MetadataFolder)
    - task: 1ESGPTRunTask@3.0.513
      displayName: "\U0001F512 Setup AntiMalware (1ES PT)"
      continueOnError: true
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ANTIMALWARESCAN_ENABLED'], 'false'), and(succeeded(), succeeded()))
      env:
        OneES_AntiMalware_DirectoryToScan: $(Build.ArtifactStagingDirectory)/sbom
        OneES_PipelineWorkspace: $(Pipeline.Workspace)
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: setupAntiMalware.ps1
        useScriptViaFeed: false
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-antimalware.AntiMalware@4
      displayName: "\U0001F6E1 Guardian: AntiMalware Scanner (Binary)"
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_ANTIMALWARESCAN_ENABLED'], 'false'), and(succeeded(), succeeded()))
      inputs:
        InputType: 'Basic'
        ScanType: 'CustomScan'
        FileDirPath: $(Build.ArtifactStagingDirectory)/sbom
        EnableServices: true
        SupportLogOnError: true
        TreatSignatureUpdateFailureAs: 'Warning'
        SignatureFreshness: 'OneDay'
        TreatStaleSignatureAs: 'Warning'
        AcceptableOutdatedSignatureInHours: 72
        TreatAcceptableOutdatedSignatureAs: 'Warning'
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-codesignvalidation.CodeSign@1
      displayName: "\U0001F6E1 Guardian: CodeSign Validation"
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), succeeded()), eq(variables['1espt.codesignvalidation.enforced'], true), ne(variables['ONEES_ENFORCED_CODESIGNVALIDATION_ENABLED'], 'false'), ne(True, false))
      continueOnError: true
      timeoutInMinutes: 10
      inputs:
        Path: $(Build.ArtifactStagingDirectory)/sbom
        MaxThreads: $(OneES_UsableProcessorCount)
        FailIfNoTargetsFound: false
        ExcludePassesFromLog: False
        Targets: f|**\*.dll;f|**\*.exe;f|**\*.sys;f|**\*.ps1;f|**\*.psm1;f|**\*.ps1xml;f|**\*.psc1;f|**\*.psd1;f|**\*.cdxml;f|**\*.vbs;f|**\*.js;f|**\*.wsf;-|.gdn\**;-|**\bootstrapper\**\vs_enterprise.exe
    - task: 1ESGPTRunTask@3.0.513
      displayName: "\U0001F6E1 Guardian: Check CodeSign Validation Results (1ES PT)"
      continueOnError: true
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), succeeded()), eq(variables['1espt.codesignvalidation.enforced'], true), ne(variables['ONEES_ENFORCED_CODESIGNVALIDATION_ENABLED'], 'false'), ne(True, false))
      env:
        OneES_PipelineWorkspace: $(Pipeline.Workspace)
        OneES_DeleteCodeSignValidationResult: True
        OneES_CustomPolicyFile: ''
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: check_csv_results.ps1
        useScriptViaFeed: false
    - task: PowerShell@2
      displayName: "\U0001F6E1 Guardian: Check if the path to run Secret Scanning is a directory (1ES PT)"
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), succeeded()) )
      env:
        OneES_OutputDirectory: $(Build.ArtifactStagingDirectory)/sbom
      inputs:
        targetType: inline
        script: |
          if ((Get-Item $env:OneES_OutputDirectory) -is [System.IO.DirectoryInfo]) {
            Write-Host "$env:OneES_OutputDirectory is a directory"
            Write-Host "##vso[task.setvariable variable=OneES_DirectoryToRunScan;issecret=false]$Env:OneES_OutputDirectory"
          } else {
            $directory = [System.IO.Path]::GetDirectoryName("$env:OneES_OutputDirectory")
            Write-Host "$env:OneES_OutputDirectory is a file, will scan the directory $directory instead because CredScan doesn't support scanning single file"
            Write-Host "##vso[task.setvariable variable=OneES_DirectoryToRunScan;issecret=false]$directory"
          }
    - task: 1ESSecretScanning@1
      displayName: "\U0001F6E1 Guardian: 1ES Secret Scanning (SPMI)"
      condition: and(ne(variables['ONEES_ENFORCED_SPMI_ENABLED'], 'false'), succeeded(), and(succeeded(), succeeded()))
      target:
        container: host
      inputs:
        Action: 'analyze'
        Target: '$(OneES_DirectoryToRunScan)\*'
        TimeoutInSeconds: 900
        MaxFileSizeInKB: 10000
      env:
        DOTNET_ROLL_FORWARD: Major
    - task: 1ESGPTRunTask@3.0.513
      displayName: "\U0001F6E1 Guardian: Set BinSkim targets (1ES PT)"
      continueOnError: false
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_BINSKIM_ENABLED'], 'false'), succeeded(), and(succeeded(), succeeded()))
      env:
        OneES_OutputDirectory: $(Build.ArtifactStagingDirectory)/sbom
        OneES_Binskim_Extensions: .dll,.exe
      inputs:
        repoId: 6c6d9a66-372d-4952-b334-cbf3a7b4db95
        path: binSkimSetTargets.ps1
        useScriptViaFeed: false
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-binskim.BinSkim@4
      displayName: "\U0001F6E1 Guardian: BinSkim 4.3.1"
      target:
        container: host
      condition: and(ne(variables['ONEES_ENFORCED_BINSKIM_ENABLED'], 'false'), ne(variables['ONEES_SKIP_BINSKIM'], true), succeeded(), and(succeeded(), succeeded()), or(ne('', ''), eq(variables['SDL_BINSKIM_ENABLED'], true), ne('4.3.1', '')))
      continueOnError: false
      inputs:
        TargetPattern: guardianGlob
        AnalyzeTargetGlob: $(ONEES_BINSKIM_TARGETS)
        AnalyzeConfigPath: default
        AnalyzeRecurse: false
        AnalyzeHashes: true
        AnalyzeStatistics: true
        AnalyzeIgnorePdbLoadError: true
        toolVersion: 4.3.1
      env:
        GDN_ALLOW_ANALYZE_NO_TARGETS: true
    - task: RoslynAnalyzers@3
      displayName: "\U0001F6E1 Guardian: Roslyn"
      target:
        container: host
      condition: and(eq(variables['ONEES_ROSLYN_RULESET_INJECTED'], true), ne(variables['ONEES_ENFORCED_ROSLYN_ENABLED'], 'false'), and(succeeded(), succeeded()))
      continueOnError: false
      inputs:
        copyLogsOnly: true
    - task: PowerShell@2
      displayName: "\U0001F6E1 Guardian: Check if enable SpotBugs"
      target:
        container: host
      condition: and( succeeded(), and(succeeded(), succeeded()) )
      env:
        OneES_SpotBugsSourcePath: $(Build.ArtifactStagingDirectory)/sbom
      inputs:
        targetType: inline
        script: |
          $jarFiles = Get-ChildItem -Path $env:OneES_SpotBugsSourcePath -Force -Filter *.jar -Recurse
          Write-Host "Jar files count: $($jarFiles.Count)"
          if ($jarFiles.Count -gt 0) {
            Write-Host "##vso[task.setvariable variable=SDL_SPOTBUGS_ENABLED;issecret=false]true"
          } else {
            Write-Host "##vso[task.setvariable variable=SDL_SPOTBUGS_ENABLED;issecret=false]false"
          }
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-spotbugs.SpotBugs@1
      displayName: "\U0001F6E1 Guardian: SpotBugs"
      target:
        container: host
      condition: eq(variables['SDL_SPOTBUGS_ENABLED'], true)
      continueOnError: false
      inputs:
        inputType: spotBugsSyntax
        targetClassPaths: $(Build.ArtifactStagingDirectory)/sbom
        sourcePath: $(Build.SourcesDirectory)
        ruleset: sdlRequired
        effort: max
    - task: SDLNativeRules@3
      displayName: "\U0001F6E1 Guardian: PREfast"
      target:
        container: host
      condition: and(eq(variables['ONEES_PREFAST_RULESET_INJECTED'], true), ne(variables['ONEES_ENFORCED_PREFAST_ENABLED'], 'false'), succeeded(), and(succeeded(), succeeded()))
      continueOnError: false
      inputs:
        copyLogsOnly: true
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-uploadtotsa.TSAUpload@2
      displayName: "\U0001F6E1 Guardian: TSAUpload"
      condition: and( succeeded(), and(succeeded(), succeeded()), or(variables['OneES_RunInAutoBaseliningMode'], True))
      target:
        container: host
      continueOnError: true
      inputs:
        GdnPublishTsaConfigFile: $(Build.SourcesDirectory)/.config/tsaoptions.json
        GdnPublishTsaOnboard: True
        GdnPublishTsaPolicy: MicrosoftCanary
        GdnPublishTsaPolicyMinimumSeverity: Error
        GdnPublishTsaGdnToolSDLNativeRules: true
        GdnPublishTsaGdnToolSDLNativeRulesSeverity: 'Warning'
        GdnPublishTsaGdnToolRoslynAnalyzers: true
        GdnPublishTsaGdnToolRoslynAnalyzersSeverity: 'Warning'
        GdnPublishTsaBaselineFiles: ''
        GdnPublishTsaBaselines: default
        GdnPublishTsaSuppressionFiles: ''
        GdnPublishTsaSuppressionSets: default
    - task: PowerShell@2
      displayName: "\U0001F512 Set Artifacts name suffix (1ES PT)"
      condition: and(succeeded(), succeeded())
      target:
        container: host
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          if ($env:SYSTEM_JOBATTEMPT -gt 1) {
            Write-Host "##vso[task.setvariable variable=GuardianArtifactNameJobAttemptSuffix]_jobAttempt$($env:SYSTEM_JOBATTEMPT)"
          } else {
            Write-Host "##vso[task.setvariable variable=GuardianArtifactNameJobAttemptSuffix]"
          }
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-report.SdtReport@2
      displayName: "\U0001F6E1 Guardian: Security Analysis Report"
      condition: and( succeeded(), and(succeeded(), succeeded()) )
      target:
        container: host
      continueOnError: true
      env:
        GDN_ALLOW_SHADOW_RC_FILES: true
        GDN_HYDRATE_RESULT_SETS: true
        GDN_SUPPRESS_HYDRATION_WARNING: true
      inputs:
        GdnExportPolicy: MicrosoftCanary
        GdnExportVstsConsole: false
        GdnExportSarifFile: true
        GdnExportTsvFile: false
        GdnExportHtmlFile: true
        GdnExportAllTools: true
        GdnExportOutputBaselineFile: $(Pipeline.Workspace)\.gdn\r\.gdnbaselines
        GdnExportOutputBaseline: default
        GdnExportOutputSuppressionFile: $(Pipeline.Workspace)\.gdn\r\.gdnsuppress
        GdnExportOutputSuppressionSet: default
        GdnExportBaselines: default
        GdnExportSuppressionFiles: ''
        GdnExportSuppressionSets: default
        GdnExportPolicyMinSev: Error
        GdnExportGdnToolCredScanSeverity: Default
        GdnExportGdnToolArmorySeverity: Default
        GdnExportGdnToolApiScanSeverity: Default
        GdnExportGdnToolBinSkimSeverity: Default
        GdnExportGdnToolCodesignValidationSeverity: Default
        GdnExportGdnToolFxCopSeverity: Default
        GdnExportGdnToolRoslynAnalyzersSeverity: CriticalError
        GdnExportGdnToolSemmleSeverity: Default
        GdnExportGdnToolSpotBugsSeverity: Default
        GdnExportGdnToolSDLNativeRulesSeverity: CriticalError
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
      displayName: "\U0001F6E1 Guardian: Publish SDL Logs to Artifacts"
      condition: and( succeeded(), and(succeeded(), succeeded()) )
      target:
        container: host
      continueOnError: true
      inputs:
        AllTools: true
        ArtifactName: $(OneES_PublishLogsArtifactName)$(GuardianArtifactNameJobAttemptSuffix)
        ArtifactType: Container
    - task: securedevelopmentteam.vss-secure-development-tools.build-task-postanalysis.PostAnalysis@2
      displayName: "\U0001F6E1 Guardian: Post Analysis"
      condition: and(succeeded(), succeeded())
      target:
        container: host
      env:
        GDN_ALLOW_SHADOW_RC_FILES: true
      inputs:
        GdnBreakAllTools: false
        GdnBreakPolicy: MicrosoftCanary
        GdnBreakPolicyMinSev: Error
        GdnBreakDisableFlighting: False
        GdnBreakGdnToolCredScanSeverity: Default
        GdnBreakGdnToolArmorySeverity: Default
        GdnBreakGdnToolApiScanSeverity: Default
        GdnBreakGdnToolBinSkimSeverity: Default
        GdnBreakGdnToolCodesignValidationSeverity: Default
        GdnBreakGdnToolFxCopSeverity: Default
        GdnBreakGdnToolRoslynAnalyzersSeverity: CriticalError
        GdnBreakGdnToolSemmleSeverity: Default
        GdnBreakGdnToolSpotBugsSeverity: Default
        GdnBreakGdnToolSDLNativeRulesSeverity: CriticalError
        GdnBreakGdnToolCredScan: $(OneES_AutoBaseline_credscan_break)
        GdnBreakGdnToolFortifySca: false
        GdnBreakGdnToolModernCop: false
        GdnBreakGdnToolPoliCheck: false
        GdnBreakGdnToolCodesignValidation: False
        GdnBreakGdnToolSpotBugs: $(OneES_AutoBaseline_spotBugs_break)
        GdnBreakGdnToolArmory: false
        GdnBreakGdnToolSemmle: false
        GdnBreakGdnToolTSLint: False
        GdnBreakGdnToolApiScan: False
        GdnBreakGdnToolBinSkim: $(OneES_AutoBaseline_binskim_break)
        GdnBreakGdnToolRoslynAnalyzers: $(OneES_AutoBaseline_roslyn_break)
        GdnBreakGdnToolFxCop: True
        GdnBreakGdnToolSDLNativeRules: $(OneES_AutoBaseline_prefast_break)
        GdnBreakBaselineFiles: $(OneES_Local_Fallback_Retail_Baseline_File_Path)
        GdnBreakBaselines: default
        GdnBreakSuppressionFiles: ''
        GdnBreakSuppressionSets: default
    - task: AdvancedSecurity-Publish@1
      displayName: "\U0001F6E1 Publish SDL Results to Advanced Security (1ES PT)"
      condition: and( succeededOrFailed(), and(succeeded(), succeeded()) )
      continueOnError: true
      target:
        container: host
      timeoutInMinutes: 5
      inputs:
